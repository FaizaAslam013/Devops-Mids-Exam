version: "3.9"

services:
  my_mongo:
    image: mongo:6.0
    container_name: my_mongo
    restart: always
    env_file:
      - .env
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  my_app:
    image: mongo-express:1.0.0
    container_name: my_app
    restart: always
    env_file:
      - .env
    depends_on:
      - my_mongo
      - redis
    expose:
      - "8081"

  redis:
    image: redis:7
    container_name: redis
    restart: always
    ports:
      - "6379:6379"

  my_nginx:
    image: nginx:latest
    container_name: my_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - my_app

volumes:
  mongo_data:
